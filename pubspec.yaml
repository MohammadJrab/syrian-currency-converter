name: syiran_pounds
description: "Syrian Pound Converter - Convert old Syrian Pounds to new currency, calculate dollar exchange rates, and break down amounts into denominations."
publish_to: 'none'

version: 1.0.3+7

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  google_fonts: ^6.2.1
  google_mobile_ads: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
